<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 400 400" role="img" aria-label="House guide">
<defs>
<linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#FFF1A8"/>
  <stop offset="35%" stop-color="#F2C75C"/>
  <stop offset="70%" stop-color="#D89B2B"/>
  <stop offset="100%" stop-color="#A96B12"/>
</linearGradient>
<radialGradient id="panel">
  <stop offset="0%" stop-color="#111C29"/>
  <stop offset="100%" stop-color="#020A13"/>
</radialGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="6"/>
</filter>
<filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="1.8" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<circle cx="200" cy="200" r="168" fill="url(#panel)" stroke="url(#gold)" stroke-width="5"/>
<circle cx="200" cy="200" r="158" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity=".7"/>

<!-- Lower golden glow -->
<path d="M72 275 A168 168 0 0 0 328 275" fill="none"
      stroke="#F2C75C" stroke-width="10" opacity=".55" filter="url(#glow)"/>
<path d="M86 284 A155 155 0 0 0 314 284" fill="none"
      stroke="#FFEAA0" stroke-width="2.5" opacity=".9"/>

<!-- Icon -->
<g fill="none" stroke="url(#gold)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#iconGlow)">
<path d="M105 166 200 85l95 81"/>
<path d="M126 151v108h148V151"/>
<path d="M177 259v-62h46v62"/>
<path d="M157 155h86v35h-86z"/>
</g>

<!-- English label -->
<text x="200" y="292" text-anchor="middle"
      fill="#F8F4E8" font-family="Montserrat, Arial, sans-serif"
      font-size="20" font-weight="500" letter-spacing="2.2">HOUSE GUIDE</text>
</svg>